services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketlab}
      POSTGRES_USER: ${POSTGRES_USER:-marketlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketlab}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - marketlab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      MARKETLAB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marketlab}:${POSTGRES_PASSWORD:-marketlab}@postgres:5432/${POSTGRES_DB:-marketlab}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-MarketLab contact@example.com}
    command:
      - /bin/sh
      - -c
      - python -m scripts.create_database_schema && exec uvicorn backend.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_MARKETLAB_API_URL: ${NEXT_PUBLIC_MARKETLAB_API_URL:-http://127.0.0.1:8000}
    restart: unless-stopped
    environment:
      MARKETLAB_API_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  marketlab-postgres:

[build-system]
requires = ["hatchling>=1.27", "editables>=0.5"]
build-backend = "hatchling.build"

[project]
name = "marketlab"
version = "0.1.0"
description = "Quantitative research, backtesting, and strategy validation platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MarketLab contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "scikit-learn>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "black>=24.8",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["marketlab"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py312"]
line-length = 88

databases:
  - name: marketlab-postgres
    databaseName: marketlab
    user: marketlab
    region: ohio
    plan: basic-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []

services:
  - type: web
    name: marketlab-api
    runtime: docker
    region: ohio
    plan: starter
    branch: main
    autoDeploy: true
    dockerfilePath: ./docker/backend.Dockerfile
    healthCheckPath: /health
    dockerCommand: python -m scripts.start_render
    disk:
      name: marketlab-artifacts
      mountPath: /app/storage
      sizeGB: 30
    envVars:
      - key: MARKETLAB_DATABASE_URL
        fromDatabase:
          name: marketlab-postgres
          property: connectionString
      - key: MARKETLAB_STORAGE_ROOT
        value: /app/storage
      - key: MARKETLAB_ALLOWED_ORIGINS
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
